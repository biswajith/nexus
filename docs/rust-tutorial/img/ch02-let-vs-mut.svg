<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Immutable vs mutable variables"><title>Immutable vs mutable variables</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="760" height="250" fill="#ffffff"/><text x="380.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">let vs let mut</text><rect x="40" y="60" width="300" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190" y="90.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">let x = 5;</text><rect x="130" y="110" width="120" height="60" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="190.0" y="148.4" font-family="Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="normal" fill="#111827">5</text><text x="190" y="199.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#dc2626">sealed box: x = 6 is an error</text><rect x="420" y="60" width="300" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="570" y="90.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">let mut y = 5;</text><rect x="510" y="110" width="120" height="60" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="570.0" y="147.7" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827">5 -&gt; 6</text><text x="570" y="199.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#16a34a">open box: y = 6 is fine</text></svg>