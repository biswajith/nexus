<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Reviewer's eye"><title>Reviewer's eye</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="270" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Thinking critically about real code</text><rect x="20" y="70" width="180" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="110.0" y="110.9" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Duplicated</text><text x="110.0" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">logic</text><rect x="220" y="70" width="180" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="310.0" y="110.9" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Non-atomic</text><text x="310.0" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">writes</text><rect x="420" y="70" width="180" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="510.0" y="110.9" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Blocking on</text><text x="510.0" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">UI thread</text><rect x="620" y="70" width="180" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="710.0" y="110.9" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Stale</text><text x="710.0" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">comments</text><text x="410" y="209.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Even good code has seams. Spot them, name them, weigh the cost.</text></svg>