<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="A closure carries a backpack"><title>A closure carries a backpack</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="300" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">A closure is a tiny function that carries a backpack</text><rect x="40" y="70" width="420" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="250" y="99.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let tag = |name| format!("{prefix}{name}");</text><text x="250" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">|name|  = the parameter (between pipes)</text><text x="250" y="156.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">format!(...)  = the body</text><rect x="520" y="70" width="300" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="670" y="96.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">the backpack</text><text x="670" y="129.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">prefix = "X-"</text><text x="670" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">(a variable from the</text><text x="670" y="166.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">surrounding code)</text><line x1="520" y1="125" x2="460" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="430" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">A plain fn cannot reach variables around it. A closure picks them up automatically.</text><text x="430" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">`move` makes it take ownership of what it carries (needed for threads, Chapter 18).</text></svg>