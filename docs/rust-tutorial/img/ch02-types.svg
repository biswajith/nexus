<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Common types"><title>Common types</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="270" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Types are labels that say what fits in the box</text><rect x="20" y="60" width="118" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="79.0" y="100.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">i32</text><text x="79" y="156.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">whole number</text><text x="79" y="171.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">-5, 0, 42</text><rect x="152" y="60" width="118" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="211.0" y="100.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">u8</text><text x="211" y="156.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">0..=255</text><text x="211" y="171.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">one byte</text><rect x="284" y="60" width="118" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="343.0" y="100.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">f64</text><text x="343" y="156.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">decimal</text><text x="343" y="171.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">3.14</text><rect x="416" y="60" width="118" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="475.0" y="100.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">bool</text><text x="475" y="164.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">true / false</text><rect x="548" y="60" width="118" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="607.0" y="100.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">char</text><text x="607" y="156.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">one Unicode</text><text x="607" y="171.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">letter  'A'</text><rect x="680" y="60" width="118" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="739.0" y="100.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold" fill="#111827">String</text><text x="739" y="156.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">text</text><text x="739" y="171.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">"hello"</text><text x="410" y="234.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Rust usually figures out the type for you (type inference) -  you write let n = 5;</text></svg>