<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Basic types"><title>Basic types</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="880" height="300" fill="#ffffff"/><text x="440.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Types are labels that say what fits in the box</text><rect x="20" y="60" width="128" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="84" y="96.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">i32</text><text x="84" y="136.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">whole number</text><text x="84" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">-5, 0, 42</text><rect x="163" y="60" width="128" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="227" y="96.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">u16</text><text x="227" y="136.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">whole number</text><text x="227" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">0 to 65,535</text><rect x="306" y="60" width="128" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="370" y="96.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">f64</text><text x="370" y="136.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">decimal number</text><text x="370" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">3.14</text><rect x="449" y="60" width="128" height="120" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="513" y="96.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">bool</text><text x="513" y="144.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">true / false</text><rect x="592" y="60" width="128" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="656" y="96.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">char</text><text x="656" y="136.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">one character</text><text x="656" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">'G'</text><rect x="735" y="60" width="128" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="799" y="96.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">&amp;str</text><text x="799" y="136.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">text in quotes</text><text x="799" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">"GET"</text><text x="440" y="229.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Rust usually figures the type out for you (type inference): you just write  let n = 5;</text><text x="440" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">(Ignore the &amp; in &amp;str for now. Chapter 5 explains it.)</text></svg>