<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="A trait is a job description"><title>A trait is a job description</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="330" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">trait = a job description        impl = who can do the job</text><rect x="290" y="45" width="280" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="430" y="72.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">trait Describe</text><text x="430" y="104.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">fn describe(&amp;self) -&gt; String</text><rect x="40" y="200" width="330" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="205" y="226.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">impl Describe for Header</text><text x="205" y="266.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">"header Host = example.test"</text><rect x="490" y="200" width="330" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="655" y="226.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold" fill="#111827">impl Describe for Method</text><text x="655" y="266.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">"sends data"</text><line x1="205" y1="200" x2="360" y2="135" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="252.5" y="167.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">promises</text><line x1="655" y1="200" x2="500" y2="135" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="607.5" y="167.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">promises</text><text x="430" y="324.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Different types, the same ability: each one fills in the job in its own way.</text></svg>