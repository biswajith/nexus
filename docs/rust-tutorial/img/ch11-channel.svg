<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="mpsc channel"><title>mpsc channel</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="260" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">mpsc channel: a post box with many senders, one receiver</text><rect x="30" y="50" width="130" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="69.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Sender (tx)</text><text x="95.0" y="84.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">task 1</text><rect x="30" y="120" width="130" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="139.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Sender (tx)</text><text x="95.0" y="154.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">task 2</text><rect x="300" y="70" width="200" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="400.0" y="105.9" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">channel</text><text x="400.0" y="124.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">[Msg][Msg][Msg]</text><rect x="650" y="70" width="140" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="720.0" y="106.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Receiver (rx)</text><text x="720.0" y="122.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">UI thread</text><line x1="160" y1="72" x2="300" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="160" y1="142" x2="300" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="500" y1="110" x2="650" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="575.0" y="106.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">try_iter()</text><text x="410" y="219.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">send() never waits for the UI; the UI picks up mail once per frame</text></svg>