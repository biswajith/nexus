<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Lifetimes: how long a borrow is valid"><title>Lifetimes: how long a borrow is valid</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="330" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">The answer is valid only while BOTH inputs are alive</text><text x="30" y="72.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">time -&gt;</text><rect x="120" y="90" width="700" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="470.0" y="116.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">first lives for a long time</text><rect x="250" y="150" width="250" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="375.0" y="176.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">second (shorter life)</text><rect x="250" y="210" width="250" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="375.0" y="228.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">result = longer(&amp;first, &amp;second)</text><text x="375.0" y="243.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">is valid here</text><rect x="500" y="210" width="320" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="660.0" y="228.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">using result here is an ERROR:</text><text x="660.0" y="243.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">second is already gone</text><line x1="500" y1="142" x2="500" y2="270" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="500" y="296.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#dc2626">second is dropped here</text></svg>