<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="derive"><title>derive</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="800" height="230" fill="#ffffff"/><text x="400.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">#[derive(...)] asks the compiler to write code for you</text><rect x="20" y="70" width="140" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="90.0" y="101.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Debug</text><text x="90.0" y="117.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">print {:?}</text><rect x="174" y="70" width="140" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="244.0" y="101.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Clone</text><text x="244.0" y="117.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">.clone()</text><rect x="328" y="70" width="140" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="398.0" y="101.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">PartialEq</text><text x="398.0" y="117.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">==</text><rect x="482" y="70" width="140" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="552.0" y="101.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Default</text><text x="552.0" y="117.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">::default()</text><rect x="636" y="70" width="140" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="706.0" y="101.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Serialize</text><text x="706.0" y="117.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">to JSON</text><text x="400" y="194.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">One line above a struct = dozens of lines you did not have to write</text></svg>