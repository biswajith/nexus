<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="A struct is a form with named blanks"><title>A struct is a form with named blanks</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="300" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">struct Header = a form with named blanks</text><rect x="30" y="50" width="360" height="230" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="210" y="79.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">FORM: Header</text><text x="55" y="120.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">key:</text><rect x="160" y="100" width="205" height="34" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="262.5" y="121.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">"Accept"</text><text x="55" y="176.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">value:</text><rect x="160" y="156" width="205" height="34" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="262.5" y="177.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">"*/*"</text><text x="55" y="232.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">enabled:</text><rect x="160" y="212" width="205" height="34" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="262.5" y="233.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">true</text><text x="610" y="104.5" font-family="monospace" f