<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Iterators are a conveyor belt"><title>Iterators are a conveyor belt</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="320" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Iterators: a conveyor belt with stations</text><rect x="20" y="60" width="150" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="94.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">headers</text><text x="95.0" y="109.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">[Host, Accept,</text><text x="95.0" y="124.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">X-Debug (off)]</text><line x1="170" y1="105" x2="200" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="200" y="60" width="150" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="275" y="95.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">iter()</text><text x="275" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">start the belt</text><line x1="345" y1="105" x2="375" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="375" y="60" width="150" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="450" y="95.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">filter(|h| h.enabled)</text><text x="450" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">keep or drop</text><line x1="520" y1="105" x2="550" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="550" y="60" width="150" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="625" y="95.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">map(|h| h.key)</text><text x="625" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">change each</text><line x1="695" y1="105" x2="725" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="725" y="60" width="150" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="800" y="95.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">collect()</text><text x="800" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">pack into a Vec</text><text x="450" y="220.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="normal" fill="#111827">["Host", "Accept"]</text><text x="450" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Nothing moves until the last station pulls items through: iterators are lazy.</text><text x="450" y="284.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">X-Debug is dropped at the filter station and never reaches the Vec.</text></svg>