<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Arc clone is cheap"><title>Arc clone is cheap</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="800" height="260" fill="#ffffff"/><text x="400.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">app.clone() on an Arc: more name tags, same data</text><rect x="300" y="115" width="200" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="400.0" y="150.9" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">the one App</text><text x="400.0" y="169.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">(refcount = 3)</text><rect x="40" y="45" width="160" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120.0" y="69.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">NexusApp</text><rect x="330" y="45" width="160" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410.0" y="69.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">async task A</text><rect x="600" y="45" width="160" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="680.0" y="69.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">async task B</text><line x1="120" y1="85" x2="340" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="410" y1="85" x2="400" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="680" y1="85" x2="460" y2="11