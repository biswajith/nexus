<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Result is a fork"><title>Result is a fork</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="800" height="280" fill="#ffffff"/><text x="400.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Result&lt;T, E&gt;: success road or error road</text><rect x="30" y="100" width="170" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="134.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">read_file(path)</text><line x1="200" y1="130" x2="330" y2="70" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="200" y1="130" x2="330" y2="190" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="40" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="430.0" y="75.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Ok(contents)</text><rect x="330" y="160" width="200" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="430.0" y="195.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Err(io::Error)</text><line x1="530" y1="70" x2="640" y2="70" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="530" y1="190" x2="640" y2="190" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="640" y="40" width="130" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="705.0" y="74.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">keep going</text><rect x="640" y="160" width="130" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="705.0" y="186.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">handle the</text><text x="705.0" y="202.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">problem</text><text x="400" y="254.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">The error is a VALUE you can inspect - not a hidden exception</text></svg>