<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="A workspace with two crates"><title>A workspace with two crates</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">A workspace: several crates, one project</text><rect x="20" y="50" width="860" height="310" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="160" y="74.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">workspace root:  Cargo.toml  [workspace]</text><rect x="50" y="95" width="380" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="240" y="119.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">rb-core   (library: src/lib.rs)</text><rect x="80" y="140" width="320" height="38" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="240.0" y="163.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Header, Method</text><rect x="80" y="190" width="320" height="38" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="240.0" y="213.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Request</text><rect x="80" y="240" width="320" height="38" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="240.0" y="263.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">variables (resolve)</text><text x="240" y="310.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">no main(): code to be USED</text><rect x="520" y="95" width="340" height="230" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="690" y="119.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">rb-cli   (binary: src/main.rs)</text><rect x="550" y="160" width="280" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="690.0" y="189.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">fn main() { .. }</text><text x="690" y="246.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">has main(): the program</text><text x="690" y="261.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">you actually run</text><line x1="520" y1="185" x2="430" y2="185" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="475.0" y="177.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">uses</text><text x="450" y="352.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Same shape as Nexus: nexus-core (engine, no window) and nexus-gui (the window, calls the engine).</text></svg>