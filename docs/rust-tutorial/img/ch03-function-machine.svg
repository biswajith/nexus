<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="A function is a machine"><title>A function is a machine</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="760" height="220" fill="#ffffff"/><text x="380.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">fn add(a: i32, b: i32) -&gt; i32</text><rect x="40" y="80" width="120" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="100.0" y="106.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">a = 2</text><text x="100.0" y="123.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">b = 3</text><line x1="160" y1="110" x2="260" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="210.0" y="106.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">in</text><rect x="260" y="60" width="240" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="380.0" y="105.0" font-family="monospace" font-size="18" text-anchor="middle" font-weight="normal" fill="#111827">fn add</text><text x="380.0" y="127.5" font-family="monospace" font-size="18" text-anchor="middle" font-weight="normal" fill="#111827">{ a + b }</text><line x1="500" y1="110" x2="600" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="550.0" y="106.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">out</text><rect x="600" y="80" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="660.0" y="117.7" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#111827">5</text><text x="380" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">No semicolon on the last line = that value is returned</text></svg>