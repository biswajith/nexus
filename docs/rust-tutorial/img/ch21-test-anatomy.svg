<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="Test anatomy"><title>Test anatomy</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="250" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Arrange - Act - Assert</text><rect x="30" y="70" width="230" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145.0" y="111.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Arrange</text><text x="145.0" y="127.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let auth = bearer();</text><rect x="300" y="70" width="230" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="415.0" y="111.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Act</text><text x="415.0" y="127.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">bind_auth_to_origin(..)</text><rect x="570" y="70" width="220" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="680.0" y="111.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Assert</text><text x="680.0" y="127.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">assert!(kept.is_none())</text><line x1="260" y1="115" x2="300" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="530" y1="115" x2="570" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="410" y="209.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">A test passes if it finishes without panicking</text></svg>