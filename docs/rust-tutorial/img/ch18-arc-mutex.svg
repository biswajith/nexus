<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="Mutex is a locker with one key"><title>Mutex is a locker with one key</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="340" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Arc&lt;Mutex&lt;T&gt;&gt;: a shared locker with ONE key</text><rect x="320" y="60" width="220" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="430.0" y="103.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">LOCKER</text><text x="430.0" y="119.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Mutex&lt;i32&gt;</text><text x="430.0" y="135.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">value = 41</text><rect x="40" y="60" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="140.0" y="84.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">thread A</text><text x="140.0" y="99.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">lock() ... gets the key</text><text x="140.0" y="114.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">value += 1</text><rect x="620" y="60" width="200" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="720.0" y="84.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">thread B</text><text x="720.0" y="99.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">lock() ... waits</text><text x="720.0" y="114.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">until the key is back</text><line x1="240" y1="95" x2="320" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="620" y1="95" x2="540" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="40" y="210" width="780" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="430.0" y="246.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Many owners of the locker (Arc), but only ONE user inside at a time (Mutex).</text><text x="430.0" y="262.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">The key (a guard) comes back automatically when it goes out of scope.</text><text x="430" y="324.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Arc = many handles to one thing     Mutex = one thread at a time</text></svg>