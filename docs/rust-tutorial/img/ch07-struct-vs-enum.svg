<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="struct = AND, enum = OR"><title>struct = AND, enum = OR</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="300" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">struct = this AND that      enum = this OR that</text><rect x="30" y="50" width="380" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="220" y="76.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">struct Request:  ALL of these</text><rect x="80" y="100" width="95" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="127.5" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">method</text><rect x="185" y="100" width="95" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="232.5" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">path</text><rect x="290" y="100" width="95" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="337.5" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">header</text><text x="220" y="186.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">a request HAS a method AND a path</text><text x="220" y="202.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">AND a header</text><text x="220" y="249.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">(Chapter 6)</text><rect x="450" y="50" width="380" height="230" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="640" y="76.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">enum Method:  ONE of these</text><rect x="480" y="100" width="105" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="532.5" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Get</text><rect x="595" y="100" width="105" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="647.5" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Post</text><rect x="710" y="100" width="105" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="762.5" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Delete</text><text x="640" y="176.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">OR   OR</text><text x="640" y="201.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">a method IS Get, or Post, or Delete.</text><text x="640" y="217.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Never two at once.</text><text x="640" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">(this chapter)</text></svg>