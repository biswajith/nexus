<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Your journey through this book"><title>Your journey through this book</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Your journey through this book</text><rect x="25" y="55" width="200" height="115" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="125" y="81.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 1: First steps</text><text x="125" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 1-3</text><text x="125" y="131.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">run, variables,</text><text x="125" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">functions</text><rect x="245" y="55" width="200" height="115" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="345" y="81.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 2: Owning things</text><text x="345" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 4-5</text><text x="345" y="131.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">ownership,</text><text x="345" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">borrowing</text><rect x="465" y="55" width="200" height="115" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="565" y="81.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 3: Modelling data</text><text x="565" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 6-9</text><text x="565" y="131.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">structs, enums,</text><text x="565" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Option, lists</text><rect x="685" y="55" width="200" height="115" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="785" y="81.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 4: Reusable code</text><text x="785" y="115.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 10-13</text><text x="785" y="131.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">traits, generics,</text><text x="785" y="147.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">lifetimes, iterators</text><rect x="25" y="195" width="200" height="115" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="125" y="221.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 5: Real projects</text><text x="125" y="255.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 14-17</text><text x="125" y="271.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">modules, crates,</text><text x="125" y="287.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">errors, JSON</text><rect x="245" y="195" width="200" height="115" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="345" y="221.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 6: Many things at once</text><text x="345" y="255.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 18-20</text><text x="345" y="271.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">threads, async,</text><text x="345" y="287.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">the Nexus bridge</text><rect x="465" y="195" width="200" height="115" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="565" y="221.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Part 7: Quality</text><text x="565" y="255.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ch 21-22</text><text x="565" y="271.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">tests,</text><text x="565" y="287.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">where next</text><line x1="225" y1="112" x2="245" y2="112" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="445" y1="112" x2="465" y2="112" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="665" y1="112" x2="685" y2="112" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="225" y1="252" x2="245" y2="252" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="445" y1="252" x2="465" y2="252" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="450" y="314.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">One tiny program, a request builder, grows a little in every chapter.</text></svg>