<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="The question mark"><title>The question mark</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">`?`  means: on success keep going, on failure return the error now</text><rect x="30" y="110" width="230" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="145.0" y="145.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">parse_port(text)?</text><line x1="260" y1="125" x2="340" y2="70" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="260" y1="155" x2="340" y2="215" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="340" y="40" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="440.0" y="75.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Ok(8080)</text><rect x="340" y="185" width="200" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="440.0" y="220.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">Err(message)</text><line x1="540" y1="70" x2="600" y2="70" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="40" width="220" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="710.0" y="66.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">port = 8080</text><text x="710.0" y="82.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">the next line runs</text><line x1="540" y1="215" x2="600" y2="215" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="185" width="220" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="710.0" y="211.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">the whole function</text><text x="710.0" y="227.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">returns Err(message)</text><text x="430" y="294.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">The function that uses ? must itself return a Result.</text></svg>