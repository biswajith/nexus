<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Nexus UI-runtime bridge"><title>Nexus UI-runtime bridge</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Bridging egui and tokio  (runtime.rs)</text><rect x="20" y="50" width="260" height="300" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">UI thread (each frame)</text><rect x="40" y="90" width="220" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="150.0" y="119.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">show() -&gt; poll()</text><rect x="40" y="170" width="220" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="150.0" y="199.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">rt.drain()  try_iter()</text><rect x="40" y="250" width="220" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="150.0" y="278.9" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">match msg { Msg::Http .. }</text><rect x="620" y="50" width="260" height="300" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="750" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">tokio worker threads</text><rect x="640" y="90" width="220" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="750.0" y="118.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">rt.spawn(async move {..})</text><rect x="640" y="170" width="220" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="750.0" y="199.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">http_send(..).await</text><rect x="640" y="250" width="220" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="750.0" y="279.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">tx.send(msg)</text><rect x="350" y="160" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="450.0" y="191.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">std::sync::mpsc</text><text x="450.0" y="207.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">channel (tx / rx)</text><line x1="260" y1="115" x2="640" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="450.0" y="111.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">1 spawn task</text><line x1="640" y1="275" x2="550" y2="215" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="562.0" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">2 result</text><line x1="350" y1="195" x2="260" y2="195" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="305.0" y="191.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">3 drained</text><rect x="300" y="310" width="300" height="34" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="450.0" y="331.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">ctx.request_repaint()  wakes the UI</text><line x1="640" y1="280" x2="600" y2="320" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/></svg>