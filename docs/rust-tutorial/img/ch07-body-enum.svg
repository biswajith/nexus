<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Enum variants can carry data"><title>Enum variants can carry data</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="300" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Variants can carry different data</text><text x="430" y="64.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">enum Body  (a body is exactly ONE of these shapes)</text><rect x="30" y="90" width="240" height="150" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="150" y="116.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">Body::Empty</text><text x="150" y="179.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">carries nothing</text><rect x="310" y="90" width="240" height="150" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="430" y="116.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">Body::Text(...)</text><rect x="340" y="140" width="180" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="430.0" y="164.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">"hello"</text><text x="430" y="209.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">carries one String</text><rect x="590" y="90" width="240" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="710" y="116.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">Body::Json(...)</text><rect x="620" y="140" width="180" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="710.0" y="164.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">"{ }"</text><text x="710" y="209.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">carries one String</text><text x="430" y="279.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">match tells you which shape you have, and hands you what is inside.</text></svg>