<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="A String is a ticket plus letters"><title>A String is a ticket plus letters</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="320" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">let request = String::from("GET /users");</text><rect x="30" y="60" width="330" height="230" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="195" y="86.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">ON THE DESK: the ticket</text><rect x="55" y="100" width="280" height="44" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="126.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">where:  shelf 7</text><rect x="55" y="152" width="280" height="44" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="178.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">len:    10  (letters now)</text><rect x="55" y="204" width="280" height="44" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="230.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">cap:    10  (letters that fit)</text><text x="195" y="276.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">you only ever hold this small card</text><rect x="500" y="60" width="370" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="685" y="86.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" 