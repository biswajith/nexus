7280" stroke-width="2"/><text x="803.0" y="144.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">r</text><rect x="821" y="120" width="32" height="40" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="837.0" y="144.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">s</text><text x="685" y="194.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">push_str(" HTTP/1.1") needs more room:</text><text x="685" y="216.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">the String asks for a bigger shelf,</text><text x="685" y="236.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">copies the letters, and updates the ticket.</text><line x1="335" y1="122" x2="500" y2="140" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="417.5" y="123.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">points to</text></svg>