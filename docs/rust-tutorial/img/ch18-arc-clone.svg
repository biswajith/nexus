<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Arc is shared ownership"><title>Arc is shared ownership</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="330" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Arc: many owners of one value</text><rect x="330" y="60" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="430.0" y="98.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">the one Vec</text><text x="430.0" y="114.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">[1, 2, 3]</text><text x="430.0" y="130.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">count = 3</text><rect x="40" y="215" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="140.0" y="246.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">main</text><text x="140.0" y="262.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(a handle)</text><rect x="330" y="215" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="430.0" y="246.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">thread A</text><text x="430.0" y="262.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(a handle)</text><rect x="620" y="215" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="720.0" y="246.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">thread B</text><text x="720.0" y="262.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(a handle)</text><line x1="140" y1="215" x2="360" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="430" y1="215" x2="430" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="720" y1="215" x2="500" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="430" y="316.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Arc::clone(&amp;x) hands out another handle (count + 1). The Vec is dropped when the LAST handle goes.</text></svg>