<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="What cargo new creates"><title>What cargo new creates</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="760" height="300" fill="#ffffff"/><text x="380.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">What `cargo new hello_cargo` creates</text><rect x="40" y="50" width="330" height="230" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="205" y="76.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">hello_cargo/  (the project folder)</text><rect x="60" y="95" width="290" height="36" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="205.0" y="117.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Cargo.toml</text><rect x="60" y="140" width="290" height="36" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="205.0" y="162.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">src/   (your code lives here)</text><rect x="80" y="185" width="250" height="36" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="205.0" y="207.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">main.rs</text><rect x="60" y="230" width="290" height="36" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="205.0" y="252.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">target/   (appears after cargo run)</text><text x="395" y="117.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">&lt;-</text><text x="420" y="109.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">the recipe card: the project's name,</text><text x="420" y="124.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">version and the libraries it needs</text><text x="420" y="207.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">&lt;-</text><text x="445" y="199.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">the program text you write.</text><text x="445" y="214.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">it starts with Hello, world!</text><text x="395" y="252.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">&lt;-</text><text x="420" y="244.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">Cargo's workshop: finished programs</text><text x="420" y="259.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">and scratch work. Never edit by hand.</text></svg>