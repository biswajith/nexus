<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="Stack vs heap"><title>Stack vs heap</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="340" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Two kinds of memory</text><rect x="30" y="50" width="340" height="270" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="200" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">THE STACK  (a stack of plates)</text><rect x="60" y="95" width="280" height="42" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="120.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">x: i32 = 5</text><rect x="60" y="150" width="280" height="42" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="175.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">ok: bool = true</text><rect x="60" y="205" width="280" height="42" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="230.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">name: String (ptr, len, cap)</text><text x="200" y="294.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">fixed size, super fast, auto-cleaned</text><rect x="450" y="50" width="340" height="270" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="620" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">THE HEAP  (a big warehouse)</text><rect x="480" y="110" width="280" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="620.0" y="139.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">H e l l o   N e x u s</text><rect x="480" y="190" width="280" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="620.0" y="219.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">[ 1, 2, 3, 4, 5, ... ]</text><text x="620" y="294.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">any size, grows, you get an address</text><line x1="340" y1="226" x2="480" y2="150" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ah)"/><text x="415.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#ea580c">pointer</text></svg>