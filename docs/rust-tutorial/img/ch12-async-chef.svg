<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-label="Async chef"><title>Async chef</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="840" height="320" fill="#ffffff"/><text x="420.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">async/await: one chef, many pots</text><circle cx="420" cy="150" r="52" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="420" y="138.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">tokio</text><text x="420" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">thread</text><text x="420" y="170.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(the chef)</text><rect x="70" y="70" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="145.0" y="96.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">pot: HTTP</text><text x="145.0" y="111.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">waiting for server</text><line x1="368" y1="150" x2="220" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="70" y="210" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="145.0" y="236.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">pot: WebSocket</text><text x="145.0" y="251.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">waiting msg</text><line x1="368" y1="150" x2="220" y2="240" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="670" y="70" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="745.0" y="96.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">pot: timer</text><text x="745.0" y="111.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">30s timeout</text><line x1="472" y1="150" x2="670" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="670" y="210" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="745.0" y="236.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">pot: file</text><text x="745.0" y="251.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">read</text><line x1="472" y1="150" x2="670" y2="240" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="420" y="294.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">.await = 'this pot is simmering: I will stir another one and come back'</text></svg>