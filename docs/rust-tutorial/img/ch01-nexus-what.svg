<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="What Nexus looks like"><title>What Nexus looks like</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Nexus: a tool for talking to web services</text><rect x="30" y="50" width="840" height="290" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><rect x="45" y="65" width="200" height="260" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="81.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Your saved</text><text x="145" y="97.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">requests</text><text x="60" y="139.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">Users API</text><text x="60" y="169.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">  GET list users</text><text x="60" y="199.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">  POST new user</text><text x="60" y="229.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">Weather API</text><rect x="265" y="65" width="590" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="560" y="89.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Build a request</text><rect x="285" y="100" width="90" height="36" r