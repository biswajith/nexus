<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-label="Enum variants carry data"><title>Enum variants carry data</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="310" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Variants can carry different data: the Nexus Msg enum</text><rect x="30" y="50" width="760" height="230" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="130" y="72.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">enum Msg</text><rect x="60" y="90" width="340" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="230.0" y="124.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Http { tab_id, result }</text><rect x="430" y="90" width="340" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="600.0" y="124.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">History(Result&lt;..&gt;)</text><rect x="60" y="175" width="340" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="230.0" y="209.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Runner { run, event }</text><rect x="430" y="175" width="340" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="600.0" y="209.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">DataPicked(Option&lt;PathBuf&gt;)</text><text x="410" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">One type, many shapes -