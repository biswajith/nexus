<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="The Nexus project folder"><title>The Nexus project folder</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Open the Nexus folder: it is a Cargo project too</text><rect x="30" y="50" width="840" height="310" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="110" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">nexus/</text><rect x="50" y="90" width="250" height="40" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="175.0" y="114.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Cargo.toml  (top-level recipe)</text><rect x="50" y="140" width="250" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="175.0" y="164.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">README.md, docs/ ...</text><rect x="330" y="85" width="520" height="255" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="590" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">crates/   (two Cargo projects live here)</text><rect x="345" y="120" width="205" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="447" y="144.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">nexus-core</text><text x="447" y="176.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">The engine.</text><text x="447" y="189.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Sends requests,</text><text x="447" y="204.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">saves files,</text><text x="447" y="219.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">runs scripts.</text><text x="447" y="258.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" font-style="italic">Knows nothing about</text><text x="447" y="273.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" font-style="italic">windows.</text><rect x="645" y="120" width="195" height="200" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="742" y="144.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">nexus-gui</text><text x="742" y="176.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">The window.</text><text x="742" y="189.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Draws buttons and</text><text x="742" y="204.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">text boxes, asks</text><text x="742" y="219.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">the engine for help.</text><text x="742" y="258.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" font-style="italic">Starts at fn main,</text><text x="742" y="273.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827" font-style="italic">like hello.rs.</text><line x1="645" y1="175" x2="550" y2="175" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="597.5" y="169.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">uses</text></svg>