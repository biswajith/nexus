<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img" aria-label="Move, clone, copy"><title>Move, clone, copy</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="290" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Three ways to hand something on</text><rect x="20" y="50" width="240" height="190" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="140" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">MOVE (default)</text><text x="140" y="118.3" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let b = a;</text><text x="140" y="134.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827"></text><text x="140" y="150.8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">a is empty now</text><rect x="290" y="50" width="240" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">CLONE (explicit)</text><text x="410" y="110.2" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let b = a.clone();</text><text x="410" y="126.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827"></text><text x="410" y="142.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">two separate copies,</text><text x="410" y="158.9" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">both usable</text><rect x="560" y="50" width="240" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="680" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">COPY (tiny types)</text><text x="680" y="110.2" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let b = a;  // i32</text><text x="680" y="126.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827"></text><text x="680" y="142.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">numbers are copied</text><text x="680" y="158.9" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">automatically</text><text x="410" y="274.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Clone costs time; the compiler makes you SAY so.</text></svg>