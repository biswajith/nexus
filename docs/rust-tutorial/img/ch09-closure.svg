<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Closure backpack"><title>Closure backpack</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="800" height="260" fill="#ffffff"/><text x="400.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">A closure is a tiny function that carries a backpack</text><rect x="50" y="70" width="300" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="200.0" y="111.5" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">|caps| {</text><text x="200.0" y="130.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">  lookup(caps[1])</text><text x="200.0" y="149.0" font-family="monospace" font-size="15" text-anchor="middle" font-weight="normal" fill="#111827">}</text><rect x="430" y="80" width="260" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="560.0" y="113.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">backpack</text><text x="560.0" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(captured variables:</text><text x="560.0" y="145.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">the scope store)</text><line x1="430" y1="125" x2="350" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="390.0" y="121.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">borrows / moves in</text><text x="400" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">`move` closures take ownership of what they carry - needed when sent to other threads</text></svg>