<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" role="img" aria-label="The ? operator"><title>The ? operator</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="250" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">`?` : keep going on Ok, bail out of the function on Err</text><rect x="30" y="80" width="220" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="114.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">read_to_string(path)?</text><rect x="290" y="80" width="220" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="114.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">from_str(&amp;text)?</text><rect x="550" y="80" width="220" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="660.0" y="114.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Ok(value)</text><line x1="250" y1="110" x2="290" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="510" y1="110" x2="550" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="120" y="180" width="200" height="45" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="220.0" y="206.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">return Err(e)  (early exit)</text><rect x="380" y="180" width="200" height="45" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="480.0" y="206.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">return Err(e)  (early exit)</text><line x1="140" y1="140" x2="190" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/><text x="135.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#dc2626">Err</text><line x1="400" y1="140" x2="450" y2="180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/><text x="395.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#dc2626">Err</text></svg>