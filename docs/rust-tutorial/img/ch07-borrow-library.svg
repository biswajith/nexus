ly="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">ONE writer</text><line x1="580" y1="190" x2="500" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="592.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">may edit</text><text x="410" y="304.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Many readers OR one writer - never both at once</text></svg>