<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Dependencies come from crates.io"><title>Dependencies come from crates.io</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Dependencies: other people's crates, fetched by Cargo</text><rect x="30" y="70" width="190" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="125.0" y="116.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">your crate</text><text x="125.0" y="132.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">request_builder</text><rect x="350" y="70" width="200" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="116.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">uuid</text><text x="450.0" y="132.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(a library crate)</text><rect x="680" y="70" width="190" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="775.0" y="116.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">getrandom</text><text x="775.0" y="132.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(uuid needs it)</text><line x1="220" y1="120" x2="350" y2="120" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="285.0" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">[dependencies]</text><line x1="550" y1="120" x2="680" y2="120" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="615.0" y="94.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">its own</text><text x="615.0" y="109.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">dependency</text><rect x="30" y="215" width="420" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="240.0" y="251.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Cargo.toml says WHAT you want:</text><text x="240.0" y="266.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">uuid = { version = "1", features = ["v4"] }</text><rect x="480" y="215" width="390" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="675.0" y="251.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Cargo.lock records the EXACT</text><text x="675.0" y="267.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">versions Cargo picked (commit it!)</text><text x="450" y="322.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Cargo downloads from crates.io, the public shelf of Rust libraries, and compiles them for you.</text></svg>