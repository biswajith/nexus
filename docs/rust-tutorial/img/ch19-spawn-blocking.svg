<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="spawn_blocking"><title>spawn_blocking</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="260" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">async threads must not be held up by slow synchronous work</text><rect x="30" y="60" width="340" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="200" y="84.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">BAD: heavy work on async thread</text><rect x="50" y="100" width="300" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">hash 10MB; all other pots stall</text><rect x="450" y="60" width="340" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="620" y="84.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">GOOD: spawn_blocking</text><rect x="470" y="100" width="300" height="50" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="620.0" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">separate thread pool does it</text><text x="410" y="229.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Nexus runs its JavaScript sandbox with spawn_blocking (scripts/mod.rs)</text></svg>