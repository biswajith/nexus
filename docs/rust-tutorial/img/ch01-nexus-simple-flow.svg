<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="What happens when you press Send"><title>What happens when you press Send</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">What happens when you press Send (the short version)</text><rect x="20" y="80" width="155" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="97.5" y="121.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">1  You click</text><text x="97.5" y="137.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Send</text><rect x="195" y="80" width="155" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="272.5" y="113.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">2  The window</text><text x="272.5" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">hands the job</text><text x="272.5" y="145.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">to a helper</text><rect x="370" y="80" width="155" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="447.5" y="113.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">3  The helper</text><text x="447.5" y="129.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">talks to the</text><text x="447.5" y="145.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">web service</text><rect x="545" y="80" width="155" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="622.5" y="121.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">4  The answer</text><text x="622.5" y="137.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">comes back</text><rect x="720" y="80" width="155" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="797.5" y="121.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">5  The window</text><text x="797.5" y="137.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">shows it</text><line x1="175" y1="125" x2="195" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="350" y1="125" x2="370" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="525" y1="125" x2="545" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="700" y1="125" x2="720" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="450" y="219.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">The window never stands waiting for the internet, so it never freezes.</text><text x="450" y="249.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Chapters 18-20 show exactly how this is done in real Nexus code.</text></svg>