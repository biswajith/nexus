<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Channel: a post box"><title>Channel: a post box</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="330" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">mpsc channel: a post box with many senders, one receiver</text><rect x="40" y="60" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="120.0" y="86.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">worker 1</text><text x="120.0" y="101.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">tx.send(..)</text><rect x="40" y="140" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="120.0" y="166.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">worker 2</text><text x="120.0" y="181.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">tx.send(..)</text><rect x="40" y="220" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="120.0" y="246.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">worker 3</text><text x="120.0" y="261.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">tx.send(..)</text><rect x="330" y="100" width="200" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="430.0" y="151.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">the channel</text><text x="430.0" y="167.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">[msg][msg][msg]</text><rect x="660" y="100" width="160" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="740.0" y="143.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">main</text><text x="740.0" y="159.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">rx.recv()</text><text x="740.0" y="175.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">rx.iter()</text><line x1="200" y1="90" x2="330" y2="130" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="200" y1="170" x2="330" y2="155" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="200" y1="250" x2="330" y2="185" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="530" y1="155" x2="660" y2="155" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="430" y="314.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">multiple producer, single consumer. Senders never wait for the receiver. The channel closes when all senders are dropped.</text></svg>