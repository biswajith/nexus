<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Nexus workspace and crates"><title>Nexus workspace and crates</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="760" height="360" fill="#ffffff"/><text x="380.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">The Nexus workspace: two crates, one direction</text><rect x="20" y="50" width="720" height="290" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="140" y="72.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Cargo.toml  (workspace root)</text><rect x="60" y="95" width="280" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="200" y="119.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">nexus-gui  (binary: nexus)</text><rect x="80" y="130" width="240" height="30" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="149.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">app.rs  - NexusApp</text><rect x="80" y="168" width="240" height="30" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="187.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">runtime.rs  - tokio + channel</text><rect x="80" y="206" width="240" height="30" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="225.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">panels/  - egui screens</text><rect x="80" y="244" width="240" he