<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Private by default"><title>Private by default</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Private by default: only pub things can be used from outside</text><rect x="40" y="55" width="500" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="290" y="82.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">mod header</text><rect x="65" y="100" width="450" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="290.0" y="124.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">pub struct Header</text><rect x="65" y="150" width="450" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="290.0" y="174.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">pub fn new(..) -&gt; Header</text><rect x="65" y="200" width="450" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="224.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">fn secret_note(..)   (private)</text><rect x="620" y="100" width="200" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="720.0" y="141.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">main.rs</text><text x="720.0" y="157.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(outside the module)</text><line x1="620" y1="120" x2="515" y2="120" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="580" y="149.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#16a34a">OK</text><line x1="620" y1="170" x2="515" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="525" y1="220" x2="610" y2="220" stroke="#dc2626" stroke-width="2"/><text x="668" y="224.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626">blocked</text><text x="430" y="309.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Modules are drawers: you decide which things stick out through a pub door.</text></svg>