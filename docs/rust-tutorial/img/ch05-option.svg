<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Option is a gift box"><title>Option is a gift box</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="800" height="260" fill="#ffffff"/><text x="400.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Option&lt;T&gt;: a gift box that might be empty</text><rect x="40" y="60" width="320" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="200" y="85.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">Some(value)</text><rect x="130" y="105" width="140" height="70" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="200.0" y="146.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="normal" fill="#111827">"admin"</text><rect x="440" y="60" width="320" height="150" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="600" y="85.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">None</text><rect x="530" y="105" width="140" height="70" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="600.0" y="145.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#111827">(empty)</text><text x="400" y="244.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">No null pointers in Rust: you MUST open the box and check before using</text></svg>