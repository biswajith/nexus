<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Nexus data flow"><title>Nexus data flow</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">What happens when you press Send</text><rect x="20" y="60" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="105.0" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">UI thread</text><text x="105.0" y="99.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(egui, redraws</text><text x="105.0" y="115.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">every frame)</text><rect x="260" y="60" width="170" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="345.0" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Runtime</text><text x="345.0" y="99.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(tokio worker</text><text x="345.0" y="115.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">threads)</text><rect x="500" y="60" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="585.0" y="83.3" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">nexus-core</text><text x="585.0" y="99.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">http_send -&gt;</text><text x="585.0" y="115.8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">reqwest</text><rect x="740" y="60" width="140" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="810.0" y="99.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">The Internet</text><line x1="190" y1="85" x2="260" y2="85" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="225.0" y="81.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">spawn</text><line x1="430" y1="85" x2="500" y2="85" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="465.0" y="81.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">await</text><line x1="670" y1="85" x2="740" y2="85" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="705.0" y="81.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">HTTP</text><rect x="260" y="210" width="170" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="345.0" y="236.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">mpsc channel</text><text x="345.0" y="252.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(Msg::Http)</text><line x1="345" y1="130" x2="345" y2="210" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="297.0" y="174.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">result Msg</text><line x1="260" y1="240" x2="105" y2="240" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="105" y1="240" x2="105" y2="132" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="175.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">poll() drains</text><text x="175.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">+ request_repaint</text><text x="560" y="226.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">1 Click Send  2 spawn async task</text><text x="560" y="241.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">3 task finishes, sends Msg</text><text x="560" y="256.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">4 UI wakes up, drains the channel</text><text x="560" y="271.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">5 response appears</text></svg>