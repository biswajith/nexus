<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Anatomy of a small Cargo.toml"><title>Anatomy of a small Cargo.toml</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="760" height="260" fill="#ffffff"/><text x="380.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Cargo.toml: the recipe card</text><rect x="30" y="50" width="330" height="190" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="50" y="82.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">[package]</text><text x="50" y="108.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">name = "hello_cargo"</text><text x="50" y="134.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">version = "0.1.0"</text><text x="50" y="160.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">edition = "2024"</text><text x="50" y="212.9" font-family="monospace" font-size="14" text-anchor="start" font-weight="normal" fill="#111827">[dependencies]</text><line x1="365" y1="105" x2="430" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="440" y="96.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">the project's name</text><text x="440" y="111.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">(also the program's name)</text><line x1="365" y1="157" x2="430" y2="157" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="440" y="156.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">which year's Rust rules to use</text><line x1="365" y1="209" x2="430" y2="209" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="440" y="217.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111827">libraries you want (empty for now)</text></svg>