<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Cargo.toml anatomy"><title>Cargo.toml anatomy</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="760" height="360" fill="#ffffff"/><text x="380.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Cargo.toml: the recipe card</text><rect x="40" y="50" width="330" height="280" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="60" y="76.5" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">[package]</text><text x="60" y="100.5" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">name = "nexus-gui"</text><text x="60" y="124.5" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">version.workspace = true</text><text x="60" y="148.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827"></text><text x="60" y="172.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">[dependencies]</text><text x="60" y="196.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">nexus-core.workspace = true</text><text x="60" y="220.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">serde.workspace = true</text><text x="60" y="244.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">eframe = { version = "0.37" }</text><text x="60" y="268.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827"></text><text x="60" y="292.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">[dev-dependencies]</text><text x="60" y="316.6" font-family="monospace" font-size="13" text-anchor="start" font-weight="normal" fill="#111827">tempfile = "3"</text><line x1="480" y1="86" x2="372" y2="86" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/><text x="490" y="90.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">who am I? (metadata)</text><line x1="480" y1="158" x2="372" y2="158" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/><text x="490" y="162.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">crates I need to RUN</text><line x1="480" y1="182" x2="372" y2="182" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/><text x="490" y="186.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">'workspace' = from the root file</text><line x1="480" y1="278" x2="372" y2="278" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ah)"/><text x="490" y="282.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#2563eb">crates only needed by tests</text><text x="380" y="349.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Cargo reads this file, downloads crates, and tells rustc what to build</text></svg>