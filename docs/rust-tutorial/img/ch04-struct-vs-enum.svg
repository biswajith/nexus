<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" role="img" aria-label="Struct vs enum"><title>Struct vs enum</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="780" height="290" fill="#ffffff"/><text x="390.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">struct = AND   -   enum = OR</text><rect x="30" y="50" width="340" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="200" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">struct: ALL of these</text><rect x="70" y="100" width="110" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="125.0" y="124.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">method</text><rect x="200" y="100" width="110" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="255.0" y="124.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">url</text><rect x="70" y="155" width="110" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="125.0" y="179.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">headers</text><rect x="200" y="155" width="110" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="255.0" y="179.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">body</text><text x="200" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">a request HAS a method AND a url AND ...</text><rect x="410" y="50" width="340" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="580" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">enum: ONE of these</text><rect x="470" y="100" width="220" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="580.0" y="124.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Folder(..)</text><rect x="470" y="155" width="220" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="580.0" y="179.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">Request(..)</text><text x="580" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">an item IS a folder OR a request</text></svg>