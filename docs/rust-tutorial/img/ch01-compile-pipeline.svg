<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="From source code to a running program"><title>From source code to a running program</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="270" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">From text file to running program</text><rect x="20" y="50" width="180" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="110.0" y="77.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">hello.rs</text><text x="110.0" y="94.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(your code:</text><text x="110.0" y="112.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">plain text)</text><rect x="235" y="50" width="180" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="325.0" y="77.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">rustc</text><text x="325.0" y="94.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(the compiler:</text><text x="325.0" y="112.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">the translator)</text><rect x="450" y="50" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="540.0" y="77.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">hello</text><text x="540.0" y="94.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(a program the</text><text x="540.0" y="112.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">computer can run)</text><line x1="200" y1="90" x2="235" y2="90" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="415" y1="90" x2="450" y2="90" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="235" y="170" width="180" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="325.0" y="191.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">Mistake? rustc stops</text><text x="325.0" y="206.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">and explains it</text><line x1="325" y1="130" x2="325" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="410" y="256.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">You find mistakes at your desk, before anyone runs the program.</text></svg>