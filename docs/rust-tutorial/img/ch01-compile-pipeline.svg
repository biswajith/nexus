<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="Compile pipeline: source to binary"><title>Compile pipeline: source to binary</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="200" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">From text file to running program</text><rect x="20" y="70" width="180" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="110.0" y="101.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">main.rs</text><text x="110.0" y="118.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(your code)</text><rect x="220" y="70" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="310.0" y="101.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">cargo</text><text x="310.0" y="118.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(the project manager)</text><rect x="420" y="70" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="510.0" y="101.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">rustc</text><text x="510.0" y="118.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(the compiler)</text><rect x="620" y="70" width="180" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="710.0" y="101.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">nexus</text><text x="710.0" y="118.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">(binary program)</text><line x1="200" y1="105" x2="220" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="400" y1="105" x2="420" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="600" y1="105" x2="620" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="410" y="179.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">cargo build / cargo run  -  compile errors stop here, BEFORE your users ever see a bug</text></svg>