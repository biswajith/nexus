<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="derive writes the code for you"><title>derive writes the code for you</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">#[derive(...)] asks the compiler to write code for you</text><rect x="25" y="60" width="150" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="100" y="90.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">Debug</text><text x="100" y="138.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">println!("{:?}", x)</text><rect x="190" y="60" width="150" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="265" y="90.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">Clone</text><text x="265" y="138.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">x.clone()</text><rect x="355" y="60" width="150" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="430" y="90.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">Copy</text><text x="430" y="132.0" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">let y = x;</text><text x="430" y="145.7" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">x still works</text><rect x="520" y="60" width="150" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="595" y="90.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">PartialEq</text><text x="595" y="138.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">x == y</text><rect x="685" y="60" width="150" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="760" y="90.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">Default</text><text x="760" y="138.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">X::default()</text><rect x="25" y="200" width="810" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="430.0" y="231.4" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">#[derive(Debug, Clone, Copy, PartialEq, Default)]</text><text x="430.0" y="247.7" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">enum Method { #[default] Get, Post }</text><text x="430" y="304.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">One line above a type saves you dozens of lines you did not have to write.</text></svg>