<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Pattern matching"><title>Pattern matching</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="300" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">match: a sorting machine that must handle every case</text><rect x="30" y="110" width="150" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="105.0" y="136.2" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">status code</text><text x="105.0" y="153.7" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">= 404</text><line x1="180" y1="140" x2="260" y2="140" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="260" y="50" width="250" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="385.0" y="84.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">500..   =&gt;  Error</text><rect x="260" y="125" width="250" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="385.0" y="159.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">400..=499  =&gt;  Warn</text><rect x="260" y="200" width="250" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="385.0" y="234.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">_  =&gt;  Info</text><line x1="510" y1="155" x2="610" y2="155" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="560.0" y="151.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">first match wins</text><rect x="610" y="125" width="170" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="695.0" y="159.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">LogLevel::Warn</text><text x="410" y="289.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">Forget a case on an enum and the compiler refuses to build (exhaustive)</text></svg>