<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Result has a success road and an error road"><title>Result has a success road and an error road</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="300" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Result&lt;T, E&gt;: the success road and the error road</text><rect x="30" y="110" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="130.0" y="149.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">parse_port("8080")</text><line x1="230" y1="130" x2="380" y2="80" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><line x1="230" y1="160" x2="380" y2="230" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="380" y="50" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="480.0" y="85.6" font-family="monospace" font-size="16" text-anchor="middle" font-weight="normal" fill="#111827">Ok(8080)</text><rect x="380" y="200" width="200" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="480.0" y="234.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">Err("not a number")</text><text x="690" y="76.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">keep going</text><text x="690" y="92.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">with the value</text><text x="690" y="226.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#