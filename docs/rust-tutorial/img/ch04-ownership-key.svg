<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Ownership as a key"><title>Ownership as a key</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="300" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Ownership: every value has exactly ONE owner (one key)</text><circle cx="110" cy="150" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="110" y="146.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">main</text><text x="110" y="162.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(owns it)</text><circle cx="410" cy="150" r="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="410" y="146.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">helper()</text><text x="410" y="162.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(now owns it)</text><circle cx="710" cy="150" r="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="710" y="146.4" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">dropped</text><text x="710" y="162.7" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">(freed)</text><rect x="30" y="215" width="160" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="110.0" y="238.8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">let s = String::new()</text><line x1="160" y1="150" x2="360" y2="150" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="260.0" y="146.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">move: key handed over</text><line x1="460" y1="150" x2="660" y2="150" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="560.0" y="144.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">owner ends: memory freed</text><text x="110" y="104.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ca8a04">KEY</text><text x="410" y="279.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#dc2626">After the move, `main` can no longer use the value - its key is gone</text></svg>