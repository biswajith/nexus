<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Lifetimes timeline"><title>Lifetimes timeline</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="300" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">A reference must not outlive what it points at</text><line x1="40" y1="230" x2="780" y2="230" stroke="#374151" stroke-width="2"/><text x="410" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">time -&gt;</text><rect x="60" y="60" width="470" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="295.0" y="84.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">auth (owner) lives here  - 'a</text><rect x="200" y="130" width="330" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365.0" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">returned &amp;'a AuthConfig  - valid inside 'a</text><rect x="560" y="60" width="200" height="40" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="660.0" y="84.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">auth dropped</text><rect x="560" y="130" width="200" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="660.0" y="154.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">reference now INVALID</text><line x1="535" y1="50" x2="535" y2="215" stroke="#dc2626"