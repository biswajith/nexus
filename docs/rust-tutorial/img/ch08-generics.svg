<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Generics"><title>Generics</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="260" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Generics: one recipe, many types</text><rect x="300" y="50" width="220" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="410.0" y="84.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">fn largest&lt;T&gt;(v: &amp;[T]) -&gt; T</text><rect x="40" y="170" width="160" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120.0" y="197.4" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">T = i32</text><line x1="410" y1="110" x2="120" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="170" width="160" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="410.0" y="197.4" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">T = f64</text><line x1="410" y1="110" x2="410" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="620" y="170" width="160" height="45" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="197.4" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">T = String</text><line x1="410" y1="110" x2="700" y2="170" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="410" y="249.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">The compiler stamps out a fast, specific copy