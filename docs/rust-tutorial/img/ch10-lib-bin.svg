<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Library and binary"><title>Library and binary</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="800" height="240" fill="#ffffff"/><text x="400.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Library crate vs binary crate</text><rect x="40" y="60" width="300" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="190.0" y="102.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">library (nexus_gui)</text><text x="190.0" y="119.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">lib.rs - reusable code</text><text x="190.0" y="137.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">tests can `use` it</text><rect x="460" y="60" width="300" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610.0" y="102.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">binary (nexus)</text><text x="610.0" y="119.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">main.rs - has fn main()</text><text x="610.0" y="137.4" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">the program you run</text><line x1="460" y1="115" x2="340" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="400.0" y="111.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">uses</text><text x="400" y="214.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Splitting them lets integration tests import NexusApp directly</text></svg>