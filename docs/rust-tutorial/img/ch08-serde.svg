<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="serde: struct &lt;-&gt; JSON"><title>serde: struct &lt;-&gt; JSON</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="300" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">#[derive(Serialize, Deserialize)]: two-way translator</text><rect x="30" y="70" width="250" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="155.0" y="117.0" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">struct KeyValuePair {</text><text x="155.0" y="133.3" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">  key: "Accept"</text><text x="155.0" y="149.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">  value: "*/*"</text><text x="155.0" y="165.8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">  enabled: true</text><text x="155.0" y="182.1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">}</text><rect x="540" y="70" width="250" height="150" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="665.0" y="117.0" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">{</text><text x="665.0" y="133.3" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827"> "key": "Accept",</text><text x="665.0" y="149.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827"> "value": "*/*",</text><text x="665.0" y="165.8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827"> "enabled": true</text><text x="665.0" y="182.1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">}</text><line x1="280" y1="110" x2="540" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="410.0" y="106.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">to_string()  (Serialize)</text><line x1="540" y1="180" x2="280" y2="180" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="410.0" y="176.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">from_str()  (Deserialize)</text><text x="410" y="264.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Nexus stores every collection as plain JSON files via this trick</text></svg>