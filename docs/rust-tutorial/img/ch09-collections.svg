<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Vec and HashMap"><title>Vec and HashMap</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Vec = numbered shelf        HashMap = labelled drawers</text><rect x="30" y="50" width="390" height="250" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="225" y="76.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">Vec&lt;String&gt;: a list in order</text><rect x="60" y="105" width="75" height="55" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="97.5" y="137.1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">GET</text><text x="97" y="189.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#2563eb">0</text><rect x="145" y="105" width="75" height="55" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="182.5" y="137.1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">POST</text><text x="182" y="189.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#2563eb">1</text><rect x="230" y="105" width="75" height="55" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="267.5" y="137.1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">PUT</text><text x="267" y="189.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#2563eb">2</text><rect x="315" y="105" width="75" height="55" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="352.5" y="137.1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">DELETE</text><text x="352" y="189.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#2563eb">3</text><text x="225" y="229.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">find by POSITION: v[2]</text><text x="225" y="259.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">grows with push(), counted by len()</text><rect x="450" y="50" width="380" height="250" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="640" y="76.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">HashMap&lt;String, String&gt;: a dictionary</text><rect x="480" y="100" width="100" height="48" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="530.0" y="128.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">host</text><line x1="580" y1="124" x2="615" y2="124" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="615" y="100" width="190" height="48" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="710.0" y="128.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">api.example.test</text><rect x="480" y="162" width="100" height="48" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="530.0" y="190.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">version</text><line x1="580" y1="186" x2="615" y2="186" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="615" y="162" width="190" height="48" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="710.0" y="190.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">v2</text><text x="640" y="239.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">find by KEY: get("host")</text><text x="640" y="266.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">no order: don't rely on it</text></svg>