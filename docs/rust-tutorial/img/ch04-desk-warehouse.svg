<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="The desk and the warehouse"><title>The desk and the warehouse</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="450.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Where a program keeps things</text><rect x="20" y="50" width="380" height="290" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="210" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">YOUR DESK  (the stack)</text><text x="210" y="96.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">small, fixed size, instant</text><rect x="45" y="110" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="210.0" y="134.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">retries = 3</text><rect x="45" y="160" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="210.0" y="184.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">secure = true</text><rect x="45" y="210" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="210.0" y="234.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">initial = 'G'</text><rect x="45" y="260" width="330" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="210.0" y="294.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">request = ticket for shelf 7</text><rect x="500" y="50" width="380" height="290" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="690" y="76.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">THE WAREHOUSE  (the heap)</text><text x="690" y="96.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">any size, can grow, you get a ticket</text><rect x="520" y="110" width="340" height="60" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="540" y="131.8" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">shelf 3</text><text x="690" y="152.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">a big list of numbers ...</text><rect x="520" y="185" width="340" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="540" y="206.8" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">shelf 7</text><text x="690" y="227.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">G E T   /users</text><rect x="520" y="260" width="340" height="60" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="540" y="281.9" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">shelf 12</text><text x="690" y="302.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7280">(free space)</text><line x1="375" y1="290" x2="520" y2="225" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="429.5" y="249.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">ticket</text></svg>