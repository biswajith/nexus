<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" role="img" aria-label="Borrow rules"><title>Borrow rules</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="260" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">The two golden rules of borrowing</text><rect x="30" y="50" width="370" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="215" y="79.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">OK: any number of &amp;T</text><text x="215" y="113.3" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let a = &amp;s;</text><text x="215" y="129.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let b = &amp;s;</text><text x="215" y="145.8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">println!("{a} {b}");</text><rect x="420" y="50" width="370" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="605" y="79.9" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">ERROR: &amp;mut + anything else</text><text x="605" y="118.3" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let a = &amp;s;</text><text x="605" y="134.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">let b = &amp;mut s;  // no!</text><text x="605" y="150.8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">println!("{a}");</text><text x="410" y="234.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">Safe by construction: no data races, no 'someone changed it under me' bugs</text></svg>