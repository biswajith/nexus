<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" role="img" aria-label="Option is a gift box that might be empty"><title>Option is a gift box that might be empty</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="820" height="280" fill="#ffffff"/><text x="410.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Option&lt;T&gt;: a gift box that might be empty</text><rect x="40" y="60" width="330" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="205" y="87.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">Some(value)</text><rect x="100" y="110" width="210" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="205.0" y="146.3" font-family="monospace" font-size="18" text-anchor="middle" font-weight="normal" fill="#111827">"GET"</text><text x="205" y="209.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">there IS something inside</text><rect x="450" y="60" width="330" height="170" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="615" y="87.2" font-family="monospace" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">None</text><text x="615" y="145.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#6b7280">(empty box)</text><text x="615" y="209.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">there is NOTHING inside</text><text x="410" y="266.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">No hidden nulls: to use the contents you must open the box and check.</text></svg>