<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Generics: one recipe many types"><title>Generics: one recipe many types</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Generics: one recipe, many types</text><rect x="280" y="45" width="300" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="430.0" y="79.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">fn swap&lt;T&gt;(pair: (T, T)) -&gt; (T, T)</text><text x="430" y="139.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">T is a blank: "whatever type you use"</text><rect x="40" y="160" width="240" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="160" y="186.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">T = i32</text><text x="160" y="218.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">swap((1, 2))</text><text x="160" y="233.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">= (2, 1)</text><rect x="310" y="160" width="240" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="430" y="186.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">T = String</text><text x="430" y="218.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">swap(("a", "b"))</text><text x="430" y="233.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">= ("b", "a")</text><rect x="580" y="160" width="240" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="700" y="186.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">T = Header</text><text x="700" y="218.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">swap((h1, h2))</text><text x="700" y="233.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">= (h2, h1)</text><text x="430" y="289.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">The compiler stamps out a fast, specific copy for each type you use: no slowdown.</text></svg>