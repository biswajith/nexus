<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-label="Iterator conveyor belt"><title>Iterator conveyor belt</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="250" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">Iterators: a conveyor belt with stations</text><rect x="20" y="80" width="110" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="75.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">variables</text><text x="75.0" y="120.7" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111827">[A, B(secret), C]</text><rect x="170" y="80" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="245.0" y="106.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">iter()</text><text x="245.0" y="121.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">start belt</text><line x1="130" y1="110" x2="170" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="340" y="80" width="150" height="60" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="415.0" y="106.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">.filter(not secret)</text><text x="415.0" y="121.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">keep or drop</text><line x1="300" y1="110" x2="340" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="510" y="80" width="150" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="585.0" y="106.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">.cloned()</text><text x="585.0" y="121.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">make copies</text><line x1="470" y1="110" x2="510" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="680" y="80" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="755.0" y="106.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">.collect()</text><text x="755.0" y="121.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">pack in Vec</text><line x1="640" y1="110" x2="680" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="430" y="189.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Nothing moves until the last station (collect) pulls items through: iterators are lazy</text><text x="430" y="219.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">from trust.rs: without_secrets()</text></svg>