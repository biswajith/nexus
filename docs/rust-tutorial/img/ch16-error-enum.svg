<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="One error enum, many kinds"><title>One error enum, many kinds</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="880" height="330" fill="#ffffff"/><text x="440.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">One error type, many kinds of failure</text><rect x="30" y="60" width="330" height="240" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="195" y="86.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">enum Error</text><rect x="50" y="105" width="290" height="36" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="127.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">UnknownMethod(String)</text><rect x="50" y="151" width="290" height="36" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="173.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">BadHeader(String)</text><rect x="50" y="197" width="290" height="36" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="219.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">InvalidPath { path, reason }</text><rect x="50" y="243" width="290" height="36" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="195.0" y="265.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">BadPort(ParseIntError)</text><rect x="510" y="60" width="340" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="680" y="86.5" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">the caller can MATCH on the kind</text><text x="680" y="121.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">UnknownMethod(m) =&gt; suggest GET</text><text x="680" y="136.7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">else =&gt; show the message</text><line x1="360" y1="115" x2="510" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="510" y="200" width="340" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="680" y="226.6" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">or just print it with {}</text><text x="680" y="266.2" font-family="monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#111827">"unknown method 'FETCH'"</text><line x1="360" y1="255" x2="510" y2="255" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><text x="440" y="326.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">A message string is for humans; an enum is for programs AND humans.</text></svg>