<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="match picks the first arm that fits"><title>match picks the first arm that fits</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#374151"/></marker></defs><rect width="860" height="320" fill="#ffffff"/><text x="430.0" y="32.3" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#111827">match: a sorting machine that must handle every case</text><rect x="30" y="110" width="170" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="115.0" y="149.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">status = 404</text><line x1="200" y1="145" x2="260" y2="145" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="260" y="60" width="330" height="200" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="425" y="86.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">match status {</text><text x="425" y="122.5" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">200 =&gt; "OK"</text><text x="425" y="152.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">301 | 302 =&gt; "moved"</text><rect x="275" y="163" width="300" height="30" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="425.0" y="182.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">400..=499 =&gt; "client error"</text><text x="425" y="222.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="normal" fill="#111827">_ =&gt; "something else"</text><text x="425" y="249.6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold" fill="#111827">}</text><line x1="590" y1="178" x2="650" y2="178" stroke="#374151" stroke-width="2.5" marker-end="url(#ah)"/><rect x="650" y="150" width="180" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="740.0" y="182.9" font-family="monospace" font-size="14" text-anchor="middle" font-weight="normal" fill="#111827">"client error"</text><text x="740" y="231.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">first arm that fits wins;</text><text x="740" y="246.7" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">_ catches everything else</text><text x="430" y="300.2" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#6b7280">Forget a case on an enum and the compiler refuses to build.</text></svg>