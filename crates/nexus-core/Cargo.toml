[package]
name = "nexus-core"
description = "Nexus engine: HTTP, auth, scripting, runner, importers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true
fake = { version = "5.1.0", features = ["chrono", "random_color"] }
regex = "1.13.1"
chrono = "0.4.45"
serde_yaml = "0.9"
base64 = "0.22"
url = "2"
reqwest = "0.13.5"
cookie_store = { version = "0.22.1", features = ["serde_json"] }
md-5 = "0.11.0"
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
rquickjs = "0.14.0"
jsonschema = { version = "0.60.2", default-features = false }
csv = "1"
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rmcp = { version = "3.9.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
axum = "0.8.9"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
tempfile = "3"
wiremock = "0.6.5"
