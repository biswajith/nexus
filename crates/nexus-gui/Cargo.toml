[package]
name = "nexus-gui"
description = "Nexus - native egui front end"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "nexus_gui"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
nexus-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
open = "5"
url = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
wiremock = "0.6"
